<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#234B97" />

    <!-- SEO title/description/OG tags are owned by the per-page <Seo> component
         (React 19 head tags) and baked into each route by the prerender step.
         No static <title> here so prerendered pages have exactly one title. -->

    <!-- Search Console / Bing verification: paste your token below and uncomment. -->
    <!-- <meta name="google-site-verification" content="REPLACE_WITH_GSC_TOKEN" /> -->
    <!-- <meta name="msvalidate.01" content="REPLACE_WITH_BING_TOKEN" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Tawk.to live chat. This is a single-page app, so loading it here once
         covers every route. The bubble sits bottom-left so it does not cover
         the WhatsApp bubble (desktop) or the Call/WhatsApp bar (mobile) from
         FloatingCtaBar. It is skipped under headless Chrome (navigator.webdriver)
         so scripts/prerender.mjs does not bake the widget into dist/ HTML. -->
    <!--Start of Tawk.to Script-->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    Tawk_API.customStyle = {
      visibility: {
        desktop: { position: 'bl', xOffset: 24, yOffset: 24 },
        mobile:  { position: 'bl', xOffset: 12, yOffset: 70 }
      }
    };
    if (!navigator.webdriver) {
      (function(){
      var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
      s1.async=true;
      s1.src='https://embed.tawk.to/6acf35d8c20bf634d5b1fe0b/1k4smkm1b';
      s1.charset='UTF-8';
      s1.setAttribute('crossorigin','*');
      s0.parentNode.insertBefore(s1,s0);
      })();
    }
    </script>
    <!--End of Tawk.to Script-->
  </body>
</html>
