name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you manually trigger a run from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: scripts/generate-sitemap.mjs derives each static page's
          # <lastmod> from the last commit that touched its source. The default
          # shallow clone has no such history, so dates would be silently dropped.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NOTE: Vite inlines these at BUILD time, and the variable name must match
      # exactly what the source reads (import.meta.env.VITE_API_BASE_URL).
      # A mismatched name does not error — it silently falls back to the
      # localhost default baked into src/api/api.js, which points every
      # visitor's browser at their own machine.
      #
      # VITE_GA4_ID is safe to leave unset for now — the analytics module is a
      # no-op without it. Add the underlying VITE_GA4_ID repository secret once
      # GA4 is actually configured.
      - name: Build website
        run: |
          cd akengg_website
          cat > .env <<'EOF'
          VITE_API_BASE_URL=https://api.akengg.in/api/v1
          VITE_SITE_URL=https://www.akengg.in
          VITE_GA4_ID=${{ secrets.VITE_GA4_ID }}
          EOF
          npm install
          # build:seo = generate-sitemap + vite build + prerender.
          # generate-sitemap.mjs rebuilds public/sitemap.xml from the live blog
          # list before the build copies public/ into dist/. It only WARNS if the
          # API is unreachable (the sitemap then ships without blog URLs) so an
          # API outage cannot block a recovery deploy — add --strict to the
          # script call if you would rather fail the build in that case.
          # prerender.mjs then renders each static route with headless Chromium
          # and writes real HTML (title, meta, canonical, JSON-LD, content).
          # Plain `npm run build` ships an empty #root shell, so crawlers and
          # social scrapers see nothing.
          npm run build:seo
          # Fail the deploy rather than ship a bundle pointing at localhost.
          if grep -rq "localhost:8080" dist/assets; then
            echo "::error::Built website bundle still references localhost:8080 — VITE_API_BASE_URL was not applied."
            exit 1
          fi
          # Fail rather than ship an unprerendered shell (e.g. if Chromium
          # could not launch on the runner).
          if ! grep -q "<title>" dist/index.html; then
            echo "::error::dist/index.html has no <title> — the prerender step did not run."
            exit 1
          fi
          # Fail rather than ship a sitemap Google cannot parse. The namespace
          # host is sitemaps.org (plural); a typo there voids the whole file.
          if ! grep -q 'xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"' dist/sitemap.xml; then
            echo "::error::dist/sitemap.xml is missing the correct sitemaps.org namespace."
            exit 1
          fi
          # Fail rather than ship GA4 baked into the static HTML. The tag is only
          # supposed to be injected client-side after a visitor grants cookie
          # consent — finding it in the prerendered snapshot means that gating
          # regressed and analytics would fire for every visitor unconditionally.
          if grep -q "googletagmanager" dist/index.html; then
            echo "::error::dist/index.html contains 'googletagmanager' — the GA4 script must only load client-side after consent, not be baked into the prerendered HTML."
            exit 1
          fi
          # Fail rather than ship without the ibr-steam-boiler service page
          # prerendered (e.g. its route was dropped from prerender.mjs).
          if [ ! -f dist/ibr-steam-boiler/index.html ]; then
            echo "::error::dist/ibr-steam-boiler/index.html is missing — check the ROUTES list in scripts/prerender.mjs."
            exit 1
          fi
          echo "Sitemap URLs: $(grep -c '<loc>' dist/sitemap.xml)"

      - name: Build admin panel
        run: |
          cd akengg_adminPanel
          cat > .env <<'EOF'
          VITE_API_BASE_URL=https://api.akengg.in/api/v1
          EOF
          npm install
          npm run build
          if grep -rq "localhost:8080" dist/assets; then
            echo "::error::Built admin bundle still references localhost:8080 — VITE_API_BASE_URL was not applied."
            exit 1
          fi

      - name: Deploy backend code + install deps on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/akengg_webapp
            git pull origin main
            cd akengg_backendapi
            npm install --omit=dev

      - name: Copy built frontend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "akengg_website/dist/*,akengg_adminPanel/dist/*"
          target: "/tmp/deploy"

      - name: Finalize deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/website/*
            sudo cp -r /tmp/deploy/akengg_website/dist/* /var/www/html/website/
            sudo chown -R www-data:www-data /var/www/html/website

            sudo rm -rf /var/www/html/admin/*
            sudo cp -r /tmp/deploy/akengg_adminPanel/dist/* /var/www/html/admin/
            sudo chown -R www-data:www-data /var/www/html/admin

            pm2 restart backend || pm2 start ~/akengg_webapp/akengg_backendapi/src/server.js --name backend --cwd ~/akengg_webapp/akengg_backendapi
            pm2 save

            rm -rf /tmp/deploy